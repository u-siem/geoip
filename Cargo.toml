[package]
name = "usiem-geoip"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "GeoIP and ASN enrichment for uSIEM events from MaxMind DB (.mmdb) files."
license = "MIT"
repository = "https://github.com/u-siem/geoip"
homepage = "https://github.com/u-siem/geoip"
readme = "README.md"
keywords = ["siem", "geoip", "maxmind", "asn", "enrichment"]
categories = ["network-programming"]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
]

[dependencies]
usiem = { version = "0.1", git = "https://github.com/u-siem/usiem", rev = "853e48b0900612e2cce0ba750adb38d9bb6c2650" }
maxminddb = { version = "0.32", features = ["mmap"] }
serde = { version = "1", features = ["derive"] }

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]

[lints.rust]
# `deny`, not `forbid`: opening a memory map is the one unsafe call, allowed
# at that call site with its justification.
unsafe_code = "deny"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(docsrs)"] }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
must_use_candidate = "allow"
return_self_not_must_use = "allow"
module_name_repetitions = "allow"
similar_names = "allow"
many_single_char_names = "allow"
too_many_lines = "allow"
unwrap_used = "warn"
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"

[profile.dev.package."*"]
opt-level = 2
